<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0b5394">
<title>Quét QR - An Nam NT</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --primary: #0b5394; --xuat: #e67e22; --giao: #16a085;
    --ok: #1e8e3e; --warn: #f29900; --err: #d93025;
    --bg: #f1f4f8; --card: #ffffff; --text: #202124; --muted: #5f6368;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  .screen { display: none; min-height: 100vh; padding: 16px; max-width: 480px; margin: auto; }
  .screen.active { display: block; }
  .card { background: var(--card); border-radius: 14px; padding: 18px;
          box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--primary); }
  h2 { font-size: 18px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  label { font-size: 14px; color: var(--muted); display: block; margin: 12px 0 6px; }
  input { width: 100%; padding: 13px; font-size: 16px; border: 1px solid #dadce0;
          border-radius: 10px; outline: none; }
  input:focus { border-color: var(--primary); }
  button { font-size: 16px; border: 0; border-radius: 10px; padding: 14px;
           cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .6; }
  .btn-primary { width: 100%; background: var(--primary); color: #fff; margin-top: 18px; }
  .btn-light { background: #e8eaed; color: var(--text); padding: 10px 14px; font-size: 14px; }
  .btn-link { background: none; color: var(--primary); padding: 8px 0; font-size: 15px; }
  .msg { margin-top: 12px; font-size: 14px; min-height: 18px; }
  .err { color: var(--err); } .ok { color: var(--ok); } .warn { color: var(--warn); }

  .topbar { display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; gap: 8px; }
  .user { font-size: 14px; color: var(--muted); }
  .user b { color: var(--text); }

  .mode-btn { width: 100%; height: 130px; color: #fff; font-size: 24px; margin-bottom: 14px;
              border-radius: 16px; display: flex; flex-direction: column;
              align-items: center; justify-content: center; gap: 6px; }
  .mode-btn small { font-size: 14px; font-weight: 400; opacity: .9; }
  .mode-btn.xuat { background: var(--xuat); }
  .mode-btn.giao { background: var(--giao); }

  .mode-tag { color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 700; }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
  .status { padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 600;
            text-align: center; margin: 12px 0; background: #e8eaed; word-break: break-all; }
  .status.ok { background: #e6f4ea; } .status.warn { background: #fef7e0; }
  .status.err { background: #fce8e6; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  .row button { background: var(--primary); color: #fff; padding: 0 16px; }

  .stats { display: flex; justify-content: space-between; font-size: 14px;
           color: var(--muted); margin-bottom: 6px; }
  .stats b { color: var(--text); }
  .net { font-size: 13px; }
  ul.history { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow: auto; }
  ul.history li { padding: 9px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  ul.history .l1 { display: flex; justify-content: space-between; gap: 8px; }
  ul.history .code { word-break: break-all; font-weight: 600; }
  ul.history .t { color: var(--muted); white-space: nowrap; }
  ul.history .l2 { font-size: 13px; margin-top: 2px; }
</style>
</head>
<body>

<!-- ============ ĐĂNG NHẬP ============ -->
<div id="scrLogin" class="screen active">
  <div class="card" style="margin-top:12vh">
    <h1>An Nam NT</h1>
    <p class="sub">Đăng nhập để quét mã QR</p>
    <label>Tài khoản</label>
    <input id="inUser" autocomplete="username" autocapitalize="none">
    <label>Mật khẩu</label>
    <input id="inPass" type="password" autocomplete="current-password">
    <button id="btnLogin" class="btn-primary">Đăng nhập</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<!-- ============ CHỌN CHỨC NĂNG ============ -->
<div id="scrMenu" class="screen">
  <div class="topbar">
    <div class="user">Xin chào, <b id="lblName"></b></div>
    <button class="btn-light" onclick="logout()">Đăng xuất</button>
  </div>
  <p class="sub">Chọn chức năng:</p>
  <button class="mode-btn xuat" onclick="openScanner('XUAT')">
    📦 XUẤT HÀNG <small>Trạng thái: Đang giao</small>
  </button>
  <button class="mode-btn giao" onclick="openScanner('GIAO')">
    🚚 GIAO HÀNG <small>Trạng thái: Đã giao</small>
  </button>
  <div id="menuPending" class="sub" style="text-align:center"></div>
  <div style="text-align:center">
    <button class="btn-link" onclick="openChangePw()">🔑 Đổi mật khẩu</button>
  </div>
</div>

<!-- ============ ĐỔI MẬT KHẨU ============ -->
<div id="scrPw" class="screen">
  <div class="topbar">
    <button class="btn-light" onclick="goMenu()">← Quay lại</button>
  </div>
  <div class="card">
    <h2>Đổi mật khẩu</h2>
    <label>Mật khẩu hiện tại</label>
    <input id="pwOld" type="password" autocomplete="current-password">
    <label>Mật khẩu mới</label>
    <input id="pwNew" type="password" autocomplete="new-password">
    <label>Nhập lại mật khẩu mới</label>
    <input id="pwNew2" type="password" autocomplete="new-password">
    <button id="btnPw" class="btn-primary" onclick="doChangePw()">Lưu mật khẩu mới</button>
    <div id="pwMsg" class="msg"></div>
  </div>
</div>

<!-- ============ QUÉT QR ============ -->
<div id="scrScan" class="screen">
  <div class="topbar">
    <button class="btn-light" onclick="backToMenu()">← Quay lại</button>
    <span id="modeTag" class="mode-tag"></span>
  </div>

  <div id="reader"></div>
  <div id="scanStatus" class="status">Đưa mã QR vào khung hình</div>

  <div class="card">
    <label style="margin-top:0">Ghi chú</label>
    <input id="inNote">
    <label>Nhập mã thủ công</label>
    <div class="row">
      <input id="inManual" autocapitalize="characters">
      <button onclick="submitManual()">Thêm</button>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <span>Đã quét: <b id="cntAll">0</b> · Chờ gửi: <b id="cntPending">0</b></span>
      <span id="net" class="net"></span>
    </div>
    <ul id="history" class="history"></ul>
  </div>
</div>

<script>
/* ===== CẤU HÌNH: dán URL Web App (đuôi /exec) vào đây ===== */
const API_URL = "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";

const MODES = {
  XUAT: { label: "📦 XUẤT HÀNG", color: "var(--xuat)" },
  GIAO: { label: "🚚 GIAO HÀNG", color: "var(--giao)" }
};
const SAME_CODE_COOLDOWN = 2500;   // ms: bỏ qua camera đọc lại cùng 1 mã liên tục
const BATCH_SIZE = 20;

let session = null;          // { token, username, name }
let currentMode = null;
let qr = null;
let items = [];              // { id, user, mode, code, note, ts, state: pending|ok|dup|err, msg }
let sending = false;
let lastCode = "", lastTime = 0;

/* ---------- Tiện ích ---------- */
const $ = id => document.getElementById(id);

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

async function api(data) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  });
  return res.json();
}

function store(key, val) {
  try { val == null ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
function load(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
}
function saveQueue() { store("qr_queue", items.filter(i => i.state === "pending")); }

function setStatus(text, type) {
  const el = $("scanStatus");
  el.textContent = text;
  el.className = "status " + (type || "");
}

function hhmmss(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString("vi-VN", { hour12: false });
}

let audioCtx = null;
function beep(kind) {   // "ok" | "warn" | "err"
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = kind === "ok" ? 1200 : kind === "warn" ? 600 : 300;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.value = 0.2;
    o.start(); o.stop(audioCtx.currentTime + (kind === "ok" ? 0.12 : 0.35));
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(kind === "ok" ? 80 : [200, 100, 200]);
}

/* ---------- Đăng nhập ---------- */
$("btnLogin").onclick = doLogin;
$("inPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const username = $("inUser").value.trim();
  const password = $("inPass").value.trim();
  const msg = $("loginMsg");
  if (!username || !password) { msg.className = "msg err"; msg.textContent = "Vui lòng nhập đủ thông tin"; return; }

  $("btnLogin").disabled = true;
  msg.className = "msg"; msg.textContent = "Đang đăng nhập...";
  try {
    const r = await api({ action: "login", username, password });
    if (r.result === "Success") {
      session = { token: r.token, username: r.username, name: r.name };
      store("qr_session", session);
      $("inPass").value = "";
      msg.textContent = "";
      // Chỉ giữ hàng chờ của đúng người này
      items = items.filter(i => i.user === session.username);
      saveQueue();
      goMenu();
      flush();
    } else {
      msg.className = "msg err"; msg.textContent = r.message || "Đăng nhập thất bại";
    }
  } catch (e) {
    msg.className = "msg err"; msg.textContent = "Không kết nối được máy chủ";
  }
  $("btnLogin").disabled = false;
}

async function logout(message, keepQueue) {
  const pending = items.filter(i => i.state === "pending").length;
  if (!keepQueue && pending &&
      !confirm("Còn " + pending + " mã chưa gửi lên hệ thống. Đăng xuất sẽ HỦY các mã này. Tiếp tục?")) return;

  await stopCamera();
  if (!keepQueue) { items = []; saveQueue(); }
  session = null;
  store("qr_session", null);
  show("scrLogin");
  $("loginMsg").className = "msg err";
  $("loginMsg").textContent = message || "";
}

/* ---------- Menu ---------- */
function goMenu() {
  $("lblName").textContent = session.name;
  updateMenuPending();
  show("scrMenu");
}
function updateMenuPending() {
  const n = items.filter(i => i.state === "pending").length;
  $("menuPending").textContent = n ? "⏳ Còn " + n + " mã đang chờ gửi" : "";
}

/* ---------- Đổi mật khẩu ---------- */
function openChangePw() {
  ["pwOld", "pwNew", "pwNew2"].forEach(id => $(id).value = "");
  $("pwMsg").textContent = "";
  show("scrPw");
}

async function doChangePw() {
  const oldPassword = $("pwOld").value.trim();
  const newPassword = $("pwNew").value.trim();
  const msg = $("pwMsg");
  msg.className = "msg err";
  if (!oldPassword || !newPassword) { msg.textContent = "Vui lòng nhập đủ thông tin"; return; }
  if (newPassword !== $("pwNew2").value.trim()) { msg.textContent = "Mật khẩu nhập lại không khớp"; return; }

  $("btnPw").disabled = true;
  msg.className = "msg"; msg.textContent = "Đang lưu...";
  try {
    const r = await api({ action: "changePassword", token: session.token, oldPassword, newPassword });
    if (r.result === "Success") {
      session.token = r.token;
      store("qr_session", session);
      msg.className = "msg ok"; msg.textContent = "✔ Đổi mật khẩu thành công";
      setTimeout(goMenu, 1200);
    } else if (r.result === "Auth") {
      logout(r.message, true);
    } else {
      msg.className = "msg err"; msg.textContent = r.message;
    }
  } catch (e) {
    msg.className = "msg err"; msg.textContent = "Không kết nối được máy chủ";
  }
  $("btnPw").disabled = false;
}

/* ---------- Quét ---------- */
async function openScanner(mode) {
  currentMode = mode;
  $("modeTag").textContent = MODES[mode].label;
  $("modeTag").style.background = MODES[mode].color;
  $("inNote").value = "";
  renderHistory();
  setStatus("Đang mở camera...");
  show("scrScan");
  beep("ok");  // mở khóa âm thanh trên iPhone

  try {
    qr = new Html5Qrcode("reader");
    await qr.start(
      { facingMode: "environment" },
      { fps: 12, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
      onScan
    );
    setStatus("Đưa mã QR vào khung hình");
  } catch (e) {
    setStatus("Không mở được camera. Hãy cấp quyền camera cho trình duyệt rồi thử lại.", "err");
  }
}

async function stopCamera() {
  if (qr) {
    try { if (qr.isScanning) await qr.stop(); qr.clear(); } catch (e) {}
    qr = null;
  }
}

async function backToMenu() {
  await stopCamera();
  goMenu();
}

function onScan(code) {
  const now = Date.now();
  if (code === lastCode && now - lastTime < SAME_CODE_COOLDOWN) return;
  lastCode = code; lastTime = now;
  addCode(code);
}

function submitManual() {
  const code = $("inManual").value.trim();
  if (!code) return;
  $("inManual").value = "";
  addCode(code);
}
$("inManual").addEventListener("keydown", e => { if (e.key === "Enter") submitManual(); });

// Thêm mã vào hàng chờ ngay lập tức — không đợi máy chủ
function addCode(raw) {
  const code = String(raw).trim();
  if (!code) return;

  const exists = items.find(i => i.code === code && i.mode === currentMode && i.state !== "err");
  if (exists) {
    beep("warn");
    setStatus("⚠ Đã quét rồi: " + code, "warn");
    return;
  }

  items.unshift({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    user: session.username,
    mode: currentMode,
    code: code,
    note: $("inNote").value.trim(),
    ts: Date.now(),
    state: "pending",
    msg: ""
  });
  if (items.length > 500) items.length = 500;

  $("inNote").value = "";
  beep("ok");
  setStatus("✔ " + code, "ok");
  saveQueue();
  renderHistory();
  flush();
}

/* ---------- Gửi nền theo lô ---------- */
async function flush() {
  if (sending || !session) return;
  const batch = items.filter(i => i.state === "pending").slice(-BATCH_SIZE).reverse(); // gửi mã cũ trước
  if (!batch.length) return;

  sending = true;
  let retryDelay = 0;
  try {
    const r = await api({
      action: "scanBatch",
      token: session.token,
      items: batch.map(i => ({ id: i.id, mode: i.mode, code: i.code, note: i.note, ts: i.ts }))
    });

    if (r.result === "Auth") {
      sending = false;
      saveQueue();
      return logout(r.message + " (các mã chưa gửi vẫn được giữ lại)", true);
    }
    if (!r.results) throw new Error(r.message || "Lỗi máy chủ");

    r.results.forEach(res => {
      const it = items.find(i => i.id === res.id);
      if (!it) return;
      if (res.result === "Success") { it.state = "ok"; it.msg = ""; }
      else if (res.result === "Duplicate") { it.state = "dup"; it.msg = res.message; beep("warn"); }
      else { it.state = "err"; it.msg = res.message; beep("err"); }
    });
    setNet(true);
  } catch (e) {
    setNet(false);
    retryDelay = 4000;
  }
  sending = false;
  saveQueue();
  renderHistory();
  updateMenuPending();

  if (items.some(i => i.state === "pending")) setTimeout(flush, retryDelay || 200);
}

setInterval(flush, 10000);                      // thử gửi lại định kỳ
window.addEventListener("online", flush);       // có mạng lại thì gửi ngay

function setNet(ok) {
  $("net").innerHTML = ok ? '<span class="ok">● Đã kết nối</span>' : '<span class="err">● Mất kết nối – sẽ tự gửi lại</span>';
}

/* ---------- Danh sách ---------- */
function renderHistory() {
  const list = items.filter(i => i.mode === currentMode);
  $("cntAll").textContent = list.length;
  $("cntPending").textContent = list.filter(i => i.state === "pending").length;

  const icon = { pending: "⏳ Đang gửi", ok: "✔ Đã lưu", dup: "⚠ Trùng", err: "✖ Lỗi" };
  const cls  = { pending: "", ok: "ok", dup: "warn", err: "err" };

  const ul = $("history");
  ul.innerHTML = "";
  list.slice(0, 100).forEach(i => {
    const li = document.createElement("li");
    li.innerHTML = '<div class="l1"><span class="code"></span><span class="t"></span></div><div class="l2"></div>';
    li.querySelector(".code").textContent = i.code;
    li.querySelector(".t").textContent = hhmmss(i.ts);
    const l2 = li.querySelector(".l2");
    l2.className = "l2 " + cls[i.state];
    l2.textContent = icon[i.state] + (i.msg ? " – " + i.msg : "") + (i.note ? " · Ghi chú: " + i.note : "");
    ul.appendChild(li);
  });
}

/* ---------- Khởi động ---------- */
items = load("qr_queue") || [];
session = load("qr_session");
if (session && session.token) { goMenu(); flush(); }
</script>
</body>
</html>
